spring:
  application:
    name: soundshelf-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/soundshelf}
    username: ${DATABASE_USERNAME:soundshelf}
    password: ${DATABASE_PASSWORD:soundshelf}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

soundshelf:
  jwt:
    # Overridden by JWT_SECRET in every deployed environment. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-1234567890}
    ttl: ${JWT_TTL:PT24H}
    issuer: soundshelf
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  itunes:
    base-url: https://itunes.apple.com
    timeout: PT6S
    country: US
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    timeout: PT20S

logging:
  level:
    com.soundshelf.api: ${LOG_LEVEL:INFO}
