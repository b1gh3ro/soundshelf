services:
  postgres:
    image: postgres:16-alpine
    container_name: soundshelf-db
    environment:
      POSTGRES_DB: soundshelf
      POSTGRES_USER: soundshelf
      POSTGRES_PASSWORD: soundshelf
    ports:
      - "5432:5432"
    volumes:
      - soundshelf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundshelf -d soundshelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soundshelf-pgdata:
